  AWSTemplateFormatVersion: "2010-09-09"
  Description: 'Create a CI/CD pipeline to deploy IAM Customer Managed Policies in AWS accounts'

  ## +-------------+ ##
  ## |  Parameters | ##
  ## +-------------+ ##

  Parameters:
    RepositoryType:
      Description: "Select the repository type you want to create a CodeStar connection for"
      Type: String
      AllowedValues:
        - GitHub
        - GitLab
      Default: GitHub
      ConstraintDescription: "Must be either GitHub or GitLab"

    S3BucketCodeBucket:
      Description: 'S3 bucket with the initial repository code. Must be created in advance.'
      Type: String
      Default: 'iam-cx-mng-pipeline-initialcode'
      MinLength: 3
      MaxLength: 63
      AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
      ConstraintDescription: 'Bucket name must be 3-63 chars, lowercase letters, numbers, dots and hyphens; must start and end with a letter or number.'

    S3BucketCodeKey:
      Description: 'Name of the zip file with the repository initial code hosted in S3 bucket above'
      Type: String
      Default: 'iam-cx-mng-pipeline.zip'
      MinLength: 5
      MaxLength: 1024
      AllowedPattern: '^[A-Za-z0-9._/-]+\.zip$'
      ConstraintDescription: 'S3 key must end with .zip and contain only letters, numbers, dots, underscores, slashes and hyphens.'

    RepositoryName:
      Description: 'Name of the GitHub repository'
      Type: String
      Default: 'iam-cx-mng-pipeline'
      MinLength: 1
      MaxLength: 100
      AllowedPattern: '^[A-Za-z0-9._-]+$'
      ConstraintDescription: 'Repository name must contain only letters, numbers, dots, underscores and hyphens (max 100 chars).'

    RepositoryOwner:
      Description: 'Username GitHub Owner'
      Type: String
      Default: 'dennisasilva'
      MinLength: 1
      MaxLength: 39
      AllowedPattern: '^[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}$'
      ConstraintDescription: 'GitHub username (1-39 chars): alphanumeric and hyphens; cannot start/end with hyphen or have consecutive hyphens.'

    BranchName:
      Description: 'Branch name to track in the source repository (e.g. main, master, develop)'
      Type: String
      Default: 'main'
      MinLength: 1
      MaxLength: 250
      AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
      ConstraintDescription: 'Branch name must start with a letter or digit and contain only letters, numbers, dots, underscores, slashes and hyphens.'

    SecretId:
      Description: 'Name of the AWS Secrets Manager secret holding the Git provider personal access token'
      Type: String
      Default: 'dev/cx-mgn-pipe/github'
      NoEcho: true
      MinLength: 1
      MaxLength: 512
      AllowedPattern: '^[A-Za-z0-9/_+=.@-]+$'
      ConstraintDescription: 'Secret name must contain only letters, numbers, and the characters / _ + = . @ -'

    ExternalId:
      Description: 'Shared secret used when assuming the cross-account deploy role. Must match the ExternalId parameter of cx-mng-stackset-deploy-role.yaml exactly. Generate via "openssl rand -hex 32" or similar.'
      Type: String
      NoEcho: true
      MinLength: 16
      MaxLength: 64
      AllowedPattern: '^[A-Za-z0-9_-]+$'
      ConstraintDescription: 'ExternalId must be 16-64 chars: alphanumeric, underscore, hyphen.'

    NamingConvention:
      Description: 'Prefix used in IAM role/CodeBuild names. Limited to 30 chars so role names fit the IAM 64-char limit (longest suffix is "-customer-managed-policies").'
      Type: String
      Default: 'cx-mng-pipeline'
      MinLength: 2
      MaxLength: 30
      AllowedPattern: '^[a-z]([a-z0-9-]*[a-z0-9])?$'
      ConstraintDescription: 'Must be lowercase, start with a letter, end with a letter or number, contain only letters/numbers/hyphens (2-30 chars).'

    ManualApproval:
      Description: 'Enable manual approval stage before deploying customer managed policies'
      Type: String
      AllowedValues:
        - 'true'
        - 'false'
      Default: 'true'

    TrustedScriptsBucket:
      Description: >
        S3 bucket (write-restricted, versioning + object-lock recommended)
        hosting the immutable Python scripts bundle used by every CodeBuild
        stage. The bundle is downloaded + SHA-256 verified by the buildspec
        BEFORE anything from the Source artifact is executed. Keep this
        bucket in an account/role separate from the one that can push to
        the tracked branch.
      Type: String
      MinLength: 3
      MaxLength: 63
      AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
      ConstraintDescription: 'Bucket name must be 3-63 chars, lowercase letters, numbers, dots and hyphens; must start and end with a letter or number.'

    TrustedScriptsKey:
      Description: >
        S3 object key of the immutable scripts bundle (tar.gz) inside
        TrustedScriptsBucket. The bundle must contain:
          validation/customer-managed-validation.py
          validation/role-validation.py
          customer-managed-policies/customer-managed-deploy.py
        Pin to a specific version-id (TrustedScriptsVersionId) and SHA-256
        (TrustedScriptsSha256) so a push to the policy-data repo cannot
        change the code the pipeline executes.
      Type: String
      MinLength: 1
      MaxLength: 1024
      AllowedPattern: '^[A-Za-z0-9._/-]+\.(tar\.gz|tgz)$'
      ConstraintDescription: 'Scripts key must end with .tar.gz or .tgz and contain only letters, numbers, dots, underscores, slashes and hyphens.'

    TrustedScriptsVersionId:
      Description: 'S3 object version-id of TrustedScriptsKey. Pinning a version-id makes the download reproducible even if a mutator later overwrites the object.'
      Type: String
      MinLength: 1
      MaxLength: 1024
      AllowedPattern: '^[A-Za-z0-9._-]+$'
      ConstraintDescription: 'Version id must contain only letters, numbers, dots, underscores and hyphens.'

    TrustedScriptsSha256:
      Description: 'Hex SHA-256 (64 lowercase hex chars) of TrustedScriptsKey (version TrustedScriptsVersionId). Compared byte-for-byte in the buildspec before any downloaded script is executed.'
      Type: String
      MinLength: 64
      MaxLength: 64
      AllowedPattern: '^[a-f0-9]{64}$'
      ConstraintDescription: 'SHA-256 must be exactly 64 lowercase hexadecimal characters.'

  ## +------------------------------------------------------+ ##
  ## | Create a condition to select the CodeStarConnection  | ##
  ## +------------------------------------------------------+ ##

  Conditions:
    CreateCodeStarConnectionGitHub: !Equals [ !Ref RepositoryType, 'GitHub' ]
    CreateCodeStarConnectionGitLab: !Equals [ !Ref RepositoryType, 'GitLab' ]
    cManualApproval: !Equals [ !Ref ManualApproval, 'true' ]

  Resources:

  ## +--------------------------------------------------------------------+ ##
  ## | Create a CodeStar connection type based on reposirotyType variable | ##
  ## +--------------------------------------------------------------------+ ##

    CodeStarConnectionGitHub:
      Type: AWS::CodeStarConnections::Connection
      Condition: CreateCodeStarConnectionGitHub
      Properties:
        ConnectionName: !Sub ${AWS::StackName}-gitHub
        ProviderType: GitHub

    CodeStarConnectionGitLab:
      Type: AWS::CodeStarConnections::Connection
      Condition: CreateCodeStarConnectionGitLab
      Properties:
        ConnectionName: !Sub ${AWS::StackName}-gitLab
        ProviderType: GitLab

  ## +----------------------------+ ##
  ## | Create a GitHub Repository | ##
  ## +----------------------------+ ##

    CxMngGitHubRepository:
      Type: AWS::CodeStar::GitHubRepository
      Properties:
        Code:
          S3:
            Bucket: !Ref S3BucketCodeBucket
            Key: !Ref S3BucketCodeKey
        EnableIssues: true
        IsPrivate: true
        RepositoryAccessToken: !Sub '{{resolve:secretsmanager:${SecretId}::::}}'
        RepositoryDescription: This GitHub repository will host code to manage AWS IAM Customer Managed Policies
        RepositoryName: !Ref RepositoryName
        RepositoryOwner: !Ref RepositoryOwner

  ## +---------------------------------------------------------------------------------------------------------+ ##
  ## | Create the CodeBuild for stages: Source, Template Validation, Customer Managed Policies and Assignments | ##
  ## +---------------------------------------------------------------------------------------------------------+ ##

    TemplateValidationCodeBuildProject:
      Type: AWS::CodeBuild::Project
      Metadata:
        cfn_nag:
          rules_to_suppress:
            - id: W32
              reason: The CodeBuild is going to use the AWS Managed key.
      Properties:
        Name: !Sub "${NamingConvention}-template-validation"
        ServiceRole: !GetAtt CodeBuildRoleTemplateValidation.Arn
        Environment:
          Type: LINUX_CONTAINER
          ComputeType: BUILD_GENERAL1_SMALL
          Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
          EnvironmentVariables:
            - Name: TZ
              Value: America/Sao_Paulo
            - Name: REGION
              Value: !Sub ${AWS::Region}
        Artifacts:
          Type: CODEPIPELINE
        TimeoutInMinutes: 480
        Source:
          Type: CODEPIPELINE
          BuildSpec: !Sub |
            version: 0.2
            # Scripts are fetched from a write-restricted bucket pinned by
            # version-id + SHA-256; nothing from source/ in SourceOutput is
            # ever executed. The data (templates/*.json) still comes from
            # SourceOutput, but it is pure JSON parsed by the trusted script.
            env:
              variables:
                TRUSTED_SCRIPTS_BUCKET: "${TrustedScriptsBucket}"
                TRUSTED_SCRIPTS_KEY: "${TrustedScriptsKey}"
                TRUSTED_SCRIPTS_VERSION_ID: "${TrustedScriptsVersionId}"
                TRUSTED_SCRIPTS_SHA256: "${TrustedScriptsSha256}"
            phases:
              build:
                commands:
                  - echo "[INFO] [BUILD] Starting template validation process"
                  - set -euo pipefail
                  - TRUSTED_DIR="$(mktemp -d)"
                  - BUNDLE="$TRUSTED_DIR/scripts.tar.gz"
                  - aws s3api get-object --bucket "$TRUSTED_SCRIPTS_BUCKET" --key "$TRUSTED_SCRIPTS_KEY" --version-id "$TRUSTED_SCRIPTS_VERSION_ID" "$BUNDLE" >/dev/null
                  - ACTUAL_SHA="$(sha256sum "$BUNDLE" | awk '{print $1}')"
                  - if [ "$ACTUAL_SHA" != "$TRUSTED_SCRIPTS_SHA256" ]; then echo "[FATAL] trusted scripts sha256 mismatch (got $ACTUAL_SHA expected $TRUSTED_SCRIPTS_SHA256)" >&2; exit 1; fi
                  - mkdir -p "$TRUSTED_DIR/scripts" && tar -xzf "$BUNDLE" -C "$TRUSTED_DIR/scripts"
                  - cd "$CODEBUILD_SRC_DIR"
                  - python3 "$TRUSTED_DIR/scripts/validation/customer-managed-validation.py" --policies-folder './templates/customer-managed-policies/' --assignments-folder './templates/assignments/'
        Tags:
          - Key: "Name"
            Value: "Template-Validation-CodeBuild-Project"

    CustomerManagedPoliciesCodeBuildProject:
      Type: AWS::CodeBuild::Project
      Metadata:
        cfn_nag:
          rules_to_suppress:
            - id: W32
              reason: The CodeBuild is going to use the AWS Managed key.
      Properties:
        Name: !Sub "${NamingConvention}-customer-managed-policies"
        ServiceRole: !GetAtt CodeBuildRoleCustomerManagedPolicies.Arn
        Environment:
          Type: LINUX_CONTAINER
          ComputeType: BUILD_GENERAL1_SMALL
          Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
          EnvironmentVariables:
            - Name: TZ
              Value: America/Sao_Paulo
            - Name: REGION
              Value: !Sub ${AWS::Region}
            - Name: STATE_BUCKET
              Value: !Ref CxMgrartifactsBucket
            - Name: EXTERNAL_ID
              Value: !Ref ExternalId
        Artifacts:
          Type: CODEPIPELINE
        Source:
          Type: CODEPIPELINE
          BuildSpec: !Sub |
            version: 0.2
            env:
              variables:
                TRUSTED_SCRIPTS_BUCKET: "${TrustedScriptsBucket}"
                TRUSTED_SCRIPTS_KEY: "${TrustedScriptsKey}"
                TRUSTED_SCRIPTS_VERSION_ID: "${TrustedScriptsVersionId}"
                TRUSTED_SCRIPTS_SHA256: "${TrustedScriptsSha256}"
            phases:
              build:
                commands:
                  - echo "[INFO] [BUILD] Starting Customer Managed Policies process"
                  - set -euo pipefail
                  - TRUSTED_DIR="$(mktemp -d)"
                  - BUNDLE="$TRUSTED_DIR/scripts.tar.gz"
                  - aws s3api get-object --bucket "$TRUSTED_SCRIPTS_BUCKET" --key "$TRUSTED_SCRIPTS_KEY" --version-id "$TRUSTED_SCRIPTS_VERSION_ID" "$BUNDLE" >/dev/null
                  - ACTUAL_SHA="$(sha256sum "$BUNDLE" | awk '{print $1}')"
                  - if [ "$ACTUAL_SHA" != "$TRUSTED_SCRIPTS_SHA256" ]; then echo "[FATAL] trusted scripts sha256 mismatch (got $ACTUAL_SHA expected $TRUSTED_SCRIPTS_SHA256)" >&2; exit 1; fi
                  - mkdir -p "$TRUSTED_DIR/scripts" && tar -xzf "$BUNDLE" -C "$TRUSTED_DIR/scripts"
                  - cd "$CODEBUILD_SRC_DIR"
                  - python3 "$TRUSTED_DIR/scripts/customer-managed-policies/customer-managed-deploy.py" --state-bucket "$STATE_BUCKET"
        Tags:
            - Key: "Name"
              Value: "Customer-Managed-Policies-CodeBuild-Project"
    
  ## +--------------------------------------------------------------------------+ ##
  ## | Create the CodeBuild for DryRun project                                | ##
  ## +--------------------------------------------------------------------------+ ##

    DryRunCodeBuildProject:
      Type: AWS::CodeBuild::Project
      Metadata:
        cfn_nag:
          rules_to_suppress:
            - id: W32
              reason: The CodeBuild is going to use the AWS Managed key.
      Properties:
        Name: !Sub "${NamingConvention}-dry-run"
        ServiceRole: !GetAtt CodeBuildRoleCustomerManagedPolicies.Arn
        Environment:
          Type: LINUX_CONTAINER
          ComputeType: BUILD_GENERAL1_SMALL
          Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
          EnvironmentVariables:
            - Name: TZ
              Value: America/Sao_Paulo
            - Name: STATE_BUCKET
              Value: !Ref CxMgrartifactsBucket
            - Name: EXTERNAL_ID
              Value: !Ref ExternalId
        Artifacts:
          Type: CODEPIPELINE
        TimeoutInMinutes: 480
        Source:
          Type: CODEPIPELINE
          BuildSpec: !Sub |
            version: 0.2
            env:
              variables:
                TRUSTED_SCRIPTS_BUCKET: "${TrustedScriptsBucket}"
                TRUSTED_SCRIPTS_KEY: "${TrustedScriptsKey}"
                TRUSTED_SCRIPTS_VERSION_ID: "${TrustedScriptsVersionId}"
                TRUSTED_SCRIPTS_SHA256: "${TrustedScriptsSha256}"
            phases:
              build:
                commands:
                  - echo "[INFO] [BUILD] Starting dry-run process"
                  - set -euo pipefail
                  - TRUSTED_DIR="$(mktemp -d)"
                  - BUNDLE="$TRUSTED_DIR/scripts.tar.gz"
                  - aws s3api get-object --bucket "$TRUSTED_SCRIPTS_BUCKET" --key "$TRUSTED_SCRIPTS_KEY" --version-id "$TRUSTED_SCRIPTS_VERSION_ID" "$BUNDLE" >/dev/null
                  - ACTUAL_SHA="$(sha256sum "$BUNDLE" | awk '{print $1}')"
                  - if [ "$ACTUAL_SHA" != "$TRUSTED_SCRIPTS_SHA256" ]; then echo "[FATAL] trusted scripts sha256 mismatch (got $ACTUAL_SHA expected $TRUSTED_SCRIPTS_SHA256)" >&2; exit 1; fi
                  - mkdir -p "$TRUSTED_DIR/scripts" && tar -xzf "$BUNDLE" -C "$TRUSTED_DIR/scripts"
                  - cd "$CODEBUILD_SRC_DIR"
                  - python3 "$TRUSTED_DIR/scripts/customer-managed-policies/customer-managed-deploy.py" --dry-run --state-bucket "$STATE_BUCKET"
        Tags:
          - Key: "Name"
            Value: "DryRun-CodeBuild-Project"

  ## +--------------------------------------------------------------------------+ ##
  ## | Create the CodeBuild for RoleValidation project                        | ##
  ## +--------------------------------------------------------------------------+ ##

    RoleValidationCodeBuildProject:
      Type: AWS::CodeBuild::Project
      Metadata:
        cfn_nag:
          rules_to_suppress:
            - id: W32
              reason: The CodeBuild is going to use the AWS Managed key.
      Properties:
        Name: !Sub "${NamingConvention}-role-validation"
        ServiceRole: !GetAtt CodeBuildRoleRoleValidation.Arn
        Environment:
          Type: LINUX_CONTAINER
          ComputeType: BUILD_GENERAL1_SMALL
          Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
          EnvironmentVariables:
            - Name: TZ
              Value: America/Sao_Paulo
            - Name: EXTERNAL_ID
              Value: !Ref ExternalId
        Artifacts:
          Type: CODEPIPELINE
        TimeoutInMinutes: 480
        Source:
          Type: CODEPIPELINE
          BuildSpec: !Sub |
            version: 0.2
            env:
              variables:
                TRUSTED_SCRIPTS_BUCKET: "${TrustedScriptsBucket}"
                TRUSTED_SCRIPTS_KEY: "${TrustedScriptsKey}"
                TRUSTED_SCRIPTS_VERSION_ID: "${TrustedScriptsVersionId}"
                TRUSTED_SCRIPTS_SHA256: "${TrustedScriptsSha256}"
            phases:
              build:
                commands:
                  - echo "[INFO] [BUILD] Starting role validation process"
                  - set -euo pipefail
                  - TRUSTED_DIR="$(mktemp -d)"
                  - BUNDLE="$TRUSTED_DIR/scripts.tar.gz"
                  - aws s3api get-object --bucket "$TRUSTED_SCRIPTS_BUCKET" --key "$TRUSTED_SCRIPTS_KEY" --version-id "$TRUSTED_SCRIPTS_VERSION_ID" "$BUNDLE" >/dev/null
                  - ACTUAL_SHA="$(sha256sum "$BUNDLE" | awk '{print $1}')"
                  - if [ "$ACTUAL_SHA" != "$TRUSTED_SCRIPTS_SHA256" ]; then echo "[FATAL] trusted scripts sha256 mismatch (got $ACTUAL_SHA expected $TRUSTED_SCRIPTS_SHA256)" >&2; exit 1; fi
                  - mkdir -p "$TRUSTED_DIR/scripts" && tar -xzf "$BUNDLE" -C "$TRUSTED_DIR/scripts"
                  - cd "$CODEBUILD_SRC_DIR"
                  - python3 "$TRUSTED_DIR/scripts/validation/role-validation.py" --assignments-folder './templates/assignments/'
        Tags:
          - Key: "Name"
            Value: "Role-Validation-CodeBuild-Project"

  ## +--------------------------------------------------------------------------+ ##
  ## | Create the CodeBuild role for RoleValidationCodeBuildProject project     | ##
  ## +--------------------------------------------------------------------------+ ##

    CodeBuildRoleRoleValidation:
      Type: AWS::IAM::Role
      Metadata:
        cfn_nag:
          rules_to_suppress:
            - id: W11
              reason: The IAM permissions associate is under review.
            - id: W28
              reason: The IAM role is used by CodeBuild project.
      Properties:
        RoleName: !Sub "${NamingConvention}-role-validation"
        Description: CodeBuild role for Role Validation CodeBuild Project
        Path: /
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - codebuild.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: CodeBuildPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: "*"
                - Effect: Allow
                  # Read the Source + upstream stage outputs. CodePipeline
                  # artifact keys are '<pipeline-name>/<ArtifactName>/<hash>'.
                  Action:
                    - s3:GetObject
                    - s3:GetObjectVersion
                    - s3:ListBucket
                  Resource:
                    - !Sub 'arn:aws:s3:::${CxMgrartifactsBucket}'
                    - !Sub 'arn:aws:s3:::${CxMgrartifactsBucket}/*'
                - Effect: Allow
                  # Write ONLY this stage's output artifact prefix. This stops
                  # a compromised stage from rewriting SourceOutput or any
                  # other stage's output artifact zip.
                  Action:
                    - s3:PutObject
                    - s3:AbortMultipartUpload
                  Resource:
                    - !Sub 'arn:aws:s3:::${CxMgrartifactsBucket}/${NamingConvention}-pipeline/RoleValidationOutput/*'
                - Effect: Allow
                  # Download the pinned, SHA-256-verified scripts bundle.
                  Action:
                    - s3:GetObject
                    - s3:GetObjectVersion
                  Resource:
                    - !Sub 'arn:aws:s3:::${TrustedScriptsBucket}/${TrustedScriptsKey}'
                - Effect: Allow
                  # Required because the artifact bucket is encrypted with
                  # SSE-KMS (alias/aws/s3). The kms:ViaService condition
                  # restricts these permissions to KMS calls made by S3 in
                  # this region only.
                  Action:
                    - kms:Decrypt
                    - kms:GenerateDataKey
                  Resource: '*'
                  Condition:
                    StringEquals:
                      'kms:ViaService': !Sub 's3.${AWS::Region}.amazonaws.com'
                - Effect: Allow
                  Action:
                    - sts:AssumeRole
                  Resource: "arn:aws:iam::*:role/deploy-customer-managed-policy"

  ## +--------------------------------------------------------------------------+ ##
  ## | Create the CodeBuild role for TemplateValidationCodeBuildProject project | ##
  ## +--------------------------------------------------------------------------+ ##
    CodeBuildRoleTemplateValidation:
      Type: AWS::IAM::Role
      Metadata:
        cfn_nag:
          rules_to_suppress:
            - id: W11
              reason: The IAM permissions associate is under review.
            - id: W28
              reason: The IAM role is used by CodeBuild project.
      Properties:
        RoleName: !Sub "${NamingConvention}-template-validation"
        Description: CodeBuild role for Template Validation CodeBuild Project
        Path: /
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - codebuild.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: CodeBuildPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: "*"
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:GetObjectVersion
                    - s3:ListBucket
                  Resource:
                    - !Sub 'arn:aws:s3:::${CxMgrartifactsBucket}'
                    - !Sub 'arn:aws:s3:::${CxMgrartifactsBucket}/*'
                - Effect: Allow
                  # Write ONLY this stage's output artifact prefix.
                  Action:
                    - s3:PutObject
                    - s3:AbortMultipartUpload
                  Resource:
                    - !Sub 'arn:aws:s3:::${CxMgrartifactsBucket}/${NamingConvention}-pipeline/TemplateValidationOutput/*'
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:GetObjectVersion
                  Resource:
                    - !Sub 'arn:aws:s3:::${TrustedScriptsBucket}/${TrustedScriptsKey}'
                - Effect: Allow
                  # Required because the artifact bucket is encrypted with
                  # SSE-KMS (alias/aws/s3). The kms:ViaService condition
                  # restricts these permissions to KMS calls made by S3 in
                  # this region only.
                  Action:
                    - kms:Decrypt
                    - kms:GenerateDataKey
                  Resource: '*'
                  Condition:
                    StringEquals:
                      'kms:ViaService': !Sub 's3.${AWS::Region}.amazonaws.com'

  ## +-------------------------------------------------------------------------------+ ##
  ## | Create the CodeBuild role for CustomerManagedPoliciesCodeBuildProject project | ##
  ## +-------------------------------------------------------------------------------+ ##
    
    CodeBuildRoleCustomerManagedPolicies:
      Type: AWS::IAM::Role
      Metadata:
        cfn_nag:
          rules_to_suppress:
            - id: W11
              reason: The IAM permissions associate is under review.
            - id: W28
              reason: The IAM role is used by CodeBuild project.
      Properties:
        RoleName: !Sub "${NamingConvention}-customer-managed-policies"
        Description: CodeBuild role for Customer Managed Policies CodeBuild Project
        Path: /
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - codebuild.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: CodeBuildPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: "*"
                - Effect: Allow
                  # Read Source + upstream artifacts, and read/write state/.
                  # State writes are additionally gated by the bucket policy's
                  # RestrictStateWritesToDeployRole rule.
                  Action:
                    - s3:GetObject
                    - s3:GetObjectVersion
                    - s3:ListBucket
                  Resource:
                    - !Sub 'arn:aws:s3:::${CxMgrartifactsBucket}'
                    - !Sub 'arn:aws:s3:::${CxMgrartifactsBucket}/*'
                - Effect: Allow
                  # Write ONLY this stage's output artifact prefix (apply + dry-run share this role).
                  Action:
                    - s3:PutObject
                    - s3:AbortMultipartUpload
                  Resource:
                    - !Sub 'arn:aws:s3:::${CxMgrartifactsBucket}/${NamingConvention}-pipeline/CustomerManagedPoliciesOutput/*'
                    - !Sub 'arn:aws:s3:::${CxMgrartifactsBucket}/${NamingConvention}-pipeline/DryRunOutput/*'
                - Effect: Allow
                  # Drift-detection state file writes/deletes.
                  Action:
                    - s3:PutObject
                    - s3:DeleteObject
                  Resource:
                    - !Sub 'arn:aws:s3:::${CxMgrartifactsBucket}/state/*'
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:GetObjectVersion
                  Resource:
                    - !Sub 'arn:aws:s3:::${TrustedScriptsBucket}/${TrustedScriptsKey}'
                - Effect: Allow
                  # Required because the artifact bucket is encrypted with
                  # SSE-KMS (alias/aws/s3). The kms:ViaService condition
                  # restricts these permissions to KMS calls made by S3 in
                  # this region only.
                  Action:
                    - kms:Decrypt
                    - kms:GenerateDataKey
                  Resource: '*'
                  Condition:
                    StringEquals:
                      'kms:ViaService': !Sub 's3.${AWS::Region}.amazonaws.com'
                - Effect: Allow
                  Action:
                    - sts:AssumeRole
                  Resource: "arn:aws:iam::*:role/deploy-customer-managed-policy"

## +-------------------------------+ ##
## | Create the CodePipeline Role  | ##
## +-------------------------------+ ##

    CodePipelineRole:
      Type: AWS::IAM::Role
      Metadata:
        cfn_nag:
          rules_to_suppress:
            - id: W11
              reason: The IAM permissions associate is under review.
            - id: W28
              reason: The IAM role is used by CodePipeline.
      Properties:
        RoleName: !Sub "${NamingConvention}-code-pipeline"
        Description: CodePipeline role for the CI/CD pipeline
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - codepipeline.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: CodePipelinePolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - codebuild:StartBuild
                    - codebuild:BatchGetBuilds
                    - codebuild:StopBuild
                  Resource: "*"
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: "*"
                - Effect: Allow
                  Action:
                    - codestar-connections:UseConnection
                    - codestar-connections:PassConnection
                  Resource: !If [ CreateCodeStarConnectionGitHub, !GetAtt CodeStarConnectionGitHub.ConnectionArn, !GetAtt CodeStarConnectionGitLab.ConnectionArn ]
                - Effect: Allow
                  Action:
                    - s3:PutObject
                    - s3:GetBucketPolicy
                    - s3:GetObject
                    - s3:GetBucketAcl
                    - s3:GetBucketLocation
                  Resource: 
                    - !Sub 'arn:aws:s3:::${CxMgrartifactsBucket}*'
                    - !Sub 'arn:aws:s3:::${CxMgrartifactsBucket}/*'
                  Condition:
                    StringEquals:
                      "s3:ResourceAccount": !Ref "AWS::AccountId"
                - Effect: Allow
                  # Required because the artifact bucket is encrypted with
                  # SSE-KMS (alias/aws/s3). The kms:ViaService condition
                  # restricts these permissions to KMS calls made by S3 in
                  # this region only.
                  Action:
                    - kms:Decrypt
                    - kms:GenerateDataKey
                  Resource: '*'
                  Condition:
                    StringEquals:
                      'kms:ViaService': !Sub 's3.${AWS::Region}.amazonaws.com'

  ## +--------------------+ ##
  ## | S3 Bucket Artifact | ##
  ## +--------------------+ ##
    CxMgrartifactsBucket:
      Type: 'AWS::S3::Bucket'    
      Metadata:
        cfn_nag:
          rules_to_suppress:
            - id: W35
              reason: "There is no need to enable log in this bucket."
            - id: W41
              reason: >
                Encryption is enabled via SSE-KMS using the AWS Managed key
                (alias/aws/s3). A customer-managed CMK was deliberately not
                created to avoid the recurring KMS key fee and the management
                overhead. Trade-off: less granular auditability and revocability,
                acceptable for operational state (no PII / secrets stored here).
        SecurityDecisions:
          Encryption: |
            SSE-KMS with the AWS Managed key alias/aws/s3.
            Reasons for choosing AWS Managed over a Customer Managed CMK:
              * No monthly key fee (~$1) and no per-key infrastructure to manage.
              * Bucket only stores pipeline artifacts and policy state files
                (hash + ARN + timestamp); no secrets or PII.
              * Versioning + BlockPublicAccess + HTTPS-only bucket policy
                already provide the data integrity / confidentiality controls
                this workload needs.
            If audit-per-key, revocability or cross-account sharing become
            requirements, replace this with an AWS::KMS::Key resource and
            update the BucketEncryption block to reference its alias.
          Ownership: |
            BucketOwnerEnforced — ACLs are disabled bucket-wide. Any object
            written to this bucket is automatically owned by the bucket owner.
            All access control is centralized on the bucket policy + IAM,
            removing the legacy per-object ACL surface.
          Retention: |
            Lifecycle rules separate two distinct content domains by prefix:
              * '<NamingConvention>-pipeline/'  — CodePipeline-managed
                artifacts (SourceOutput zips, build outputs). Current version
                expires after 90 days; noncurrent versions after 30 days.
              * 'state/'                        — state files used by the
                deploy script for drift detection. Current version NEVER
                expires (no ExpirationInDays). Noncurrent versions kept 365
                days for forensic history.
            The two prefixes are disjoint by construction, so the rules never
            overlap. Anything written to the bucket outside these prefixes is
            preserved indefinitely (intentional — likely operator action).
            Both rules also clean up incomplete multipart uploads after 7 days.
      Properties:
        BucketName: !Sub ${AWS::AccountId}-${AWS::Region}-cx-mng-artfcs
        OwnershipControls:
          Rules:
            # ACLs disabled bucket-wide; bucket owner is always object owner.
            # AWS-recommended default since April 2023 for new buckets.
            - ObjectOwnership: BucketOwnerEnforced
        VersioningConfiguration:
          Status: Enabled
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            # SSE-KMS with the AWS Managed key (alias/aws/s3).
            # No KMSMasterKeyID is set on purpose — that delegates the key
            # choice to S3, which uses the account-wide aws/s3 managed key.
            # See Metadata.SecurityDecisions.Encryption for the full rationale.
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: 'aws:kms'
              BucketKeyEnabled: true

        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

        LifecycleConfiguration:
          Rules:
            # Rule 1: expire CodePipeline-managed artifacts after 90 days.
            # Prefix intentionally targets the pipeline-name path only, so
            # this rule never matches anything under state/.
            - Id: ExpirePipelineArtifacts
              Status: Enabled
              Prefix: !Sub "${NamingConvention}-pipeline/"
              ExpirationInDays: 90
              NoncurrentVersionExpiration:
                NoncurrentDays: 30
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 7
            # Rule 2: keep state/ files. NO ExpirationInDays = current
            # versions are preserved forever (drift detection depends on it).
            # Old versions are pruned after 365 days for forensic history.
            - Id: PreserveState
              Status: Enabled
              Prefix: state/
              NoncurrentVersionExpiration:
                NoncurrentDays: 365
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 7

  ## +-------------------------------+ ##
  ## | S3 Bucket Policy for Artifact | ##
  ## +-------------------------------+ ##

    CxMgrartifactsBucketPolicy:
      Type: 'AWS::S3::BucketPolicy'
      Properties:
        Bucket: !Ref CxMgrartifactsBucket
        PolicyDocument:
          Version: 2012-10-17
          Statement:
            - Sid: HTTPSOnly
              Effect: Deny
              Principal:
                AWS: "*"
              Action:
                - s3:*
              Resource: 
              - !Sub arn:aws:s3:::${CxMgrartifactsBucket}/*
              - !Sub arn:aws:s3:::${CxMgrartifactsBucket}
              Condition:
                Bool:
                  aws:SecureTransport: false
            # Protect the state/ prefix against tampering. Only the deploy
            # CodeBuild role legitimately writes/deletes state files; every
            # other principal (including other roles in this account) is
            # denied PutObject/DeleteObject on state/*. This makes the
            # drift-detection state trustworthy without needing HMAC signing,
            # because the set of writers is enforced by the bucket policy.
            # Reads are NOT restricted here. Break-glass: an admin can edit
            # this policy temporarily to recover a state file by hand.
            - Sid: RestrictStateWritesToDeployRole
              Effect: Deny
              Principal:
                AWS: "*"
              Action:
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub arn:aws:s3:::${CxMgrartifactsBucket}/state/*
              Condition:
                StringNotEquals:
                  aws:PrincipalArn: !GetAtt CodeBuildRoleCustomerManagedPolicies.Arn

  ## +-----------------------------------------------------------------------------------------------------------+ ##
  ## | Create a CodePipeline with stages: Source, Template Validation, Customer Managed Policies and Assignments | ##
  ## +-----------------------------------------------------------------------------------------------------------+ ##

    CodePipeline:
      Type: AWS::CodePipeline::Pipeline
      Properties:
        Name: !Sub "${NamingConvention}-pipeline"
        RoleArn: !GetAtt CodePipelineRole.Arn
        ArtifactStore:
          Type: S3
          Location: !Ref CxMgrartifactsBucket
        PipelineType: V2
        Stages:
          - Name: Source
            Actions:
              - Name: Source
                InputArtifacts: []
                ActionTypeId:
                  Category: Source
                  Owner: AWS
                  Version: '1'
                  Provider: CodeStarSourceConnection
                Configuration:
                  ConnectionArn: !If [ CreateCodeStarConnectionGitHub, !GetAtt CodeStarConnectionGitHub.ConnectionArn, !GetAtt CodeStarConnectionGitLab.ConnectionArn ]
                  FullRepositoryId: !Sub ${RepositoryOwner}/${RepositoryName}
                  BranchName: !Ref BranchName
                  # Disable auto-trigger on push. The pipeline is released by a
                  # human operator (StartPipelineExecution) only after they have
                  # verified the commit signature, CODEOWNERS review, and the
                  # TrustedScripts* parameters still match the intended script
                  # bundle. See README "Secure release workflow".
                  DetectChanges: "false"
                  OutputArtifactFormat: "CODE_ZIP"
                RunOrder: 1
                OutputArtifacts:
                  - Name: SourceOutput

          - Name: TemplateValidation
            Actions:
              - Name: TemplateValidation
                ActionTypeId:
                  Category: Build
                  Owner: AWS
                  Provider: CodeBuild
                  Version: '1'
                Configuration:
                  ProjectName: !Ref TemplateValidationCodeBuildProject
                RunOrder: 1
                InputArtifacts:
                  - Name: SourceOutput
                OutputArtifacts:
                  - Name: TemplateValidationOutput

          - Name: RoleValidation
            Actions:
              - Name: RoleValidation
                ActionTypeId:
                  Category: Build
                  Owner: AWS
                  Provider: CodeBuild
                  Version: '1'
                Configuration:
                  ProjectName: !Ref RoleValidationCodeBuildProject
                RunOrder: 1
                InputArtifacts:
                  - Name: SourceOutput
                OutputArtifacts:
                  - Name: RoleValidationOutput

          - Name: DryRun
            Actions:
              - Name: DryRun
                ActionTypeId:
                  Category: Build
                  Owner: AWS
                  Provider: CodeBuild
                  Version: '1'
                Configuration:
                  ProjectName: !Ref DryRunCodeBuildProject
                RunOrder: 1
                InputArtifacts:
                  - Name: SourceOutput
                OutputArtifacts:
                  - Name: DryRunOutput

          - !If
            - cManualApproval
            - Name: Approval
              Actions:
                - Name: Approval
                  ActionTypeId:
                    Category: Approval
                    Owner: AWS
                    Version: '1'
                    Provider: Manual
                  Configuration:
                    CustomData: "Review DryRun logs and approve before deploying customer managed policies."
            - !Ref AWS::NoValue

          - Name: CustomerManagedPolicies
            Actions:
              - Name: CustomerManagedPolicies
                ActionTypeId:
                  Category: Build
                  Owner: AWS
                  Provider: CodeBuild
                  Version: '1'
                Configuration:
                  ProjectName: !Ref CustomerManagedPoliciesCodeBuildProject
                RunOrder: 1
                InputArtifacts:
                  - Name: SourceOutput
                OutputArtifacts:
                  - Name: CustomerManagedPoliciesOutput