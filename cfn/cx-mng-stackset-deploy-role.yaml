AWSTemplateFormatVersion: "2010-09-09"
Description: 'IAM role used by the customer-managed-policies pipeline to deploy IAM policies into target accounts. Deployed via CloudFormation StackSet.'

Parameters:
  PipelineAccountId:
    Description: 'AWS Account ID of the account that hosts the pipeline (12 digits).'
    Type: String
    MinLength: 12
    MaxLength: 12
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: 'PipelineAccountId must be exactly 12 digits.'
  NamingConvention:
    Description: 'Naming convention used by the pipeline. Must match the NamingConvention parameter of cx-mng-pipeline.yaml.'
    Type: String
    Default: 'cx-mng-pipeline'
    MinLength: 2
    MaxLength: 30
    AllowedPattern: '^[a-z]([a-z0-9-]*[a-z0-9])?$'
    ConstraintDescription: 'Must be lowercase, start with a letter, end with a letter or number, contain only letters/numbers/hyphens (2-30 chars).'
  ExternalId:
    Description: 'Shared secret required when the pipeline assumes this role (AWS Well-Architected pattern for cross-account roles). Must match the ExternalId parameter of cx-mng-pipeline.yaml exactly. Generate via "openssl rand -hex 32" or similar.'
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 64
    AllowedPattern: '^[A-Za-z0-9_-]+$'
    ConstraintDescription: 'ExternalId must be 16-64 chars: alphanumeric, underscore, hyphen.'

Resources:
  DeployCustomerManagedPolicyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: deploy-customer-managed-policy
      Description: 'Role assumed by the pipeline to manage IAM customer-managed policies in this account.'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !Sub 'arn:aws:iam::${PipelineAccountId}:role/${NamingConvention}-role-validation'
                - !Sub 'arn:aws:iam::${PipelineAccountId}:role/${NamingConvention}-customer-managed-policies'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                # ExternalId acts as a shared secret. Even if the pipeline
                # account is compromised, an attacker holding only the role
                # ARN cannot assume this role without also knowing the
                # ExternalId value (which lives in Secrets-Manager-backed
                # NoEcho parameters on both stacks).
                'sts:ExternalId': !Ref ExternalId
      Policies:
        - PolicyName: customer-managed-policy-management
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read-only actions. Unconditioned because they neither mutate
              # IAM nor leak secrets beyond what the pipeline needs for
              # drift detection and reconciliation.
              - Sid: IAMPolicyRead
                Effect: Allow
                Action:
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:GetRole
                  - iam:ListPolicies
                  - iam:ListPolicyVersions
                  - iam:ListPolicyTags
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:policy/*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/deploy-customer-managed-policy'
              # CreatePolicy is only allowed when the request itself establishes
              # the cx-mng:true ownership tag. The deploy script passes Tags=
              # on CreatePolicy, so authorization sees aws:RequestTag/cx-mng=true
              # and the newly minted policy is born inside the management
              # boundary. Without this gate, an attacker who can call this role
              # could mint untagged policies outside the pipeline's reach.
              - Sid: IAMPolicyCreateOnlyTagged
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/*'
                Condition:
                  StringEquals:
                    'aws:RequestTag/cx-mng': 'true'
              # Destructive / mutating actions that do NOT change tags are
              # restricted to policies that already carry the cx-mng:true tag.
              # This makes IAM (not just the deploy script) the enforcement
              # point: even a buggy or tampered script cannot delete/modify
              # policies the pipeline does not own.
              - Sid: IAMPolicyModifyOnlyTagged
                Effect: Allow
                Action:
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicy
                  - iam:DeletePolicyVersion
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/*'
                Condition:
                  StringEquals:
                    'aws:ResourceTag/cx-mng': 'true'
              # TagPolicy keeps the ResourceTag gate (only touch policies we
              # already own) and additionally forbids rewriting the ownership
              # key to anything but 'true': if a request includes cx-mng, it
              # must still be cx-mng=true after the call. StringEqualsIfExists
              # lets the deploy role add other tags without being forced to
              # repeat cx-mng in every request.
              - Sid: IAMPolicyTagOnlyTagged
                Effect: Allow
                Action:
                  - iam:TagPolicy
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/*'
                Condition:
                  StringEquals:
                    'aws:ResourceTag/cx-mng': 'true'
                  StringEqualsIfExists:
                    'aws:RequestTag/cx-mng': 'true'
              # UntagPolicy keeps the ResourceTag gate and additionally forbids
              # removing the cx-mng key itself: aws:TagKeys is the set of keys
              # the request is targeting, and ForAllValues:StringNotEquals
              # denies the call if ANY of them equals 'cx-mng'. Combined with
              # IAMPolicyTagOnlyTagged this makes the ownership tag immutable
              # from this role's perspective.
              - Sid: IAMPolicyUntagOnlyTagged
                Effect: Allow
                Action:
                  - iam:UntagPolicy
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/*'
                Condition:
                  StringEquals:
                    'aws:ResourceTag/cx-mng': 'true'
                  ForAllValues:StringNotEquals:
                    'aws:TagKeys':
                      - 'cx-mng'
      Tags:
        - Key: cx-mng
          Value: 'true'
        - Key: ManagedBy
          Value: sso-pipeline
