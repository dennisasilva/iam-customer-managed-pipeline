AWSTemplateFormatVersion: "2010-09-09"
Description: 'IAM Role para deploy de Customer Managed Policies via pipeline (deploy via StackSet)'

Parameters:
  PipelineAccountId:
    Description: 'Account ID da conta onde a pipeline roda'
    Type: String
  NamingConvention:
    Description: 'Naming convention usada na pipeline (deve ser igual ao parametro NamingConvention do cx-mng-policies-2.yaml)'
    Type: String
    Default: 'cx-mng-pipeline'

Resources:
  DeployCustomerManagedPolicyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: deploy-customer-managed-policy
      Description: 'Role assumida pela pipeline para gerenciar Customer Managed Policies nesta conta'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !Sub 'arn:aws:iam::${PipelineAccountId}:role/${NamingConvention}-role-validation'
                - !Sub 'arn:aws:iam::${PipelineAccountId}:role/${NamingConvention}-customer-managed-policies'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: customer-managed-policy-management
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: IAMPolicyManagement
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicy
                  - iam:DeletePolicyVersion
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:GetRole
                  - iam:ListPolicies
                  - iam:ListPolicyVersions
                  - iam:ListPolicyTags
                  - iam:TagPolicy
                  - iam:UntagPolicy
                Resource: '*'
      Tags:
        - Key: cx-mng
          Value: 'true'
        - Key: ManagedBy
          Value: sso-pipeline
