AWSTemplateFormatVersion: "2010-09-09"
Description: 'IAM role used by the customer-managed-policies pipeline to deploy IAM policies into target accounts. Deployed via CloudFormation StackSet.'

Parameters:
  PipelineAccountId:
    Description: 'AWS Account ID of the account that hosts the pipeline (12 digits).'
    Type: String
    MinLength: 12
    MaxLength: 12
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: 'PipelineAccountId must be exactly 12 digits.'
  NamingConvention:
    Description: 'Naming convention used by the pipeline. Must match the NamingConvention parameter of cx-mng-pipeline.yaml.'
    Type: String
    Default: 'cx-mng-pipeline'
    MinLength: 2
    MaxLength: 30
    AllowedPattern: '^[a-z]([a-z0-9-]*[a-z0-9])?$'
    ConstraintDescription: 'Must be lowercase, start with a letter, end with a letter or number, contain only letters/numbers/hyphens (2-30 chars).'
  ExternalId:
    Description: 'Shared secret required when the pipeline assumes this role (AWS Well-Architected pattern for cross-account roles). Must match the ExternalId parameter of cx-mng-pipeline.yaml exactly. Generate via "openssl rand -hex 32" or similar.'
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 64
    AllowedPattern: '^[A-Za-z0-9_-]+$'
    ConstraintDescription: 'ExternalId must be 16-64 chars: alphanumeric, underscore, hyphen.'

Resources:
  # Read-only role used by the pre-approval RoleValidation and DryRun stages.
  # Separating this from the mutation-capable deploy role is a CWE-653
  # compartmentalization control: even if a repository writer tampers with the
  # scripts those stages run, the credentials they can obtain are limited to
  # the IAM read actions below and cannot create, modify or delete any IAM
  # policy in this account.
  ValidateCustomerManagedPolicyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: validate-customer-managed-policy
      Description: 'Read-only role assumed by the pipeline pre-approval validation and dry-run stages to inspect IAM customer-managed policies in this account.'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                # Only the two pre-approval CodeBuild service roles may assume
                # this read-only role; the apply-stage principal is intentionally
                # excluded so that the validate role cannot be used as a backdoor.
                - !Sub 'arn:aws:iam::${PipelineAccountId}:role/${NamingConvention}-role-validation'
                - !Sub 'arn:aws:iam::${PipelineAccountId}:role/${NamingConvention}-dry-run'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                # ExternalId acts as a shared secret. Even if the pipeline
                # account is compromised, an attacker holding only the role
                # ARN cannot assume this role without also knowing the
                # ExternalId value (which lives in Secrets-Manager-backed
                # NoEcho parameters on both stacks).
                'sts:ExternalId': !Ref ExternalId
      Policies:
        - PolicyName: customer-managed-policy-validate
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: IAMPolicyReadOnly
                Effect: Allow
                Action:
                  # Minimal read set required by role-validation.py and the
                  # dry-run path of customer-managed-deploy.py. No mutating
                  # actions, no iam:Attach*/PutRolePolicy. Any attempt to
                  # mutate IAM from a tampered pre-approval script fails at
                  # the IAM authorization layer.
                  - iam:GetRole
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicies
                  - iam:ListPolicyTags
                  - iam:ListPolicyVersions
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:policy/*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/deploy-customer-managed-policy'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/validate-customer-managed-policy'
      Tags:
        - Key: cx-mng
          Value: 'true'
        - Key: ManagedBy
          Value: sso-pipeline

  # Mutation-capable role used ONLY by the post-approval CustomerManagedPolicies
  # (apply) stage. The RoleValidation and DryRun principals are intentionally
  # NOT trusted here so a tampered pre-approval script cannot mutate IAM.
  DeployCustomerManagedPolicyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: deploy-customer-managed-policy
      Description: 'Role assumed by the pipeline to manage IAM customer-managed policies in this account.'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                # Only the apply-stage CodeBuild service role may assume this
                # mutation-capable role. The pre-approval RoleValidation and
                # DryRun principals use the separate read-only role above.
                - !Sub 'arn:aws:iam::${PipelineAccountId}:role/${NamingConvention}-customer-managed-policies'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                # ExternalId acts as a shared secret. Even if the pipeline
                # account is compromised, an attacker holding only the role
                # ARN cannot assume this role without also knowing the
                # ExternalId value (which lives in Secrets-Manager-backed
                # NoEcho parameters on both stacks).
                'sts:ExternalId': !Ref ExternalId
      Policies:
        - PolicyName: customer-managed-policy-management
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read + create actions. CreatePolicy cannot be gated by a tag
              # condition because the policy (and therefore its tag) does not
              # exist yet at create time; the deploy script applies cx-mng:true
              # immediately afterwards via TagPolicy.
              - Sid: IAMPolicyReadAndCreate
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:GetRole
                  - iam:ListPolicies
                  - iam:ListPolicyVersions
                  - iam:ListPolicyTags
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:policy/*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/deploy-customer-managed-policy'
              # Destructive / mutating actions are restricted to policies that
              # already carry the cx-mng:true tag. This makes IAM (not just the
              # deploy script) the enforcement point: even a buggy or tampered
              # script cannot delete/modify policies the pipeline does not own.
              - Sid: IAMPolicyModifyOnlyTagged
                Effect: Allow
                Action:
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicy
                  - iam:DeletePolicyVersion
                  - iam:TagPolicy
                  - iam:UntagPolicy
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/*'
                Condition:
                  StringEquals:
                    'aws:ResourceTag/cx-mng': 'true'
      Tags:
        - Key: cx-mng
          Value: 'true'
        - Key: ManagedBy
          Value: sso-pipeline
