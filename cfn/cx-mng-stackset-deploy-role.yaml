AWSTemplateFormatVersion: "2010-09-09"
Description: 'IAM role used by the customer-managed-policies pipeline to deploy IAM policies into target accounts. Deployed via CloudFormation StackSet.'

Parameters:
  PipelineAccountId:
    Description: 'AWS Account ID of the account that hosts the pipeline (12 digits).'
    Type: String
    MinLength: 12
    MaxLength: 12
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: 'PipelineAccountId must be exactly 12 digits.'
  NamingConvention:
    Description: 'Naming convention used by the pipeline. Must match the NamingConvention parameter of cx-mng-pipeline.yaml.'
    Type: String
    Default: 'cx-mng-pipeline'
    MinLength: 2
    MaxLength: 30
    AllowedPattern: '^[a-z]([a-z0-9-]*[a-z0-9])?$'
    ConstraintDescription: 'Must be lowercase, start with a letter, end with a letter or number, contain only letters/numbers/hyphens (2-30 chars).'
  ExternalId:
    Description: 'Shared secret required when the pipeline assumes this role (AWS Well-Architected pattern for cross-account roles). Must match the ExternalId parameter of cx-mng-pipeline.yaml exactly. Generate via "openssl rand -hex 32" or similar.'
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 64
    AllowedPattern: '^[A-Za-z0-9_-]+$'
    ConstraintDescription: 'ExternalId must be 16-64 chars: alphanumeric, underscore, hyphen.'

Resources:
  DeployCustomerManagedPolicyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: deploy-customer-managed-policy
      Description: 'Role assumed by the pipeline to manage IAM customer-managed policies in this account.'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !Sub 'arn:aws:iam::${PipelineAccountId}:role/${NamingConvention}-role-validation'
                - !Sub 'arn:aws:iam::${PipelineAccountId}:role/${NamingConvention}-customer-managed-policies'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                # ExternalId acts as a shared secret. It is stored in AWS
                # Secrets Manager in the pipeline account and injected into
                # the CodeBuild projects as a Type: SECRETS_MANAGER
                # environment variable, so its cleartext value is NEVER
                # written into the CodeBuild project configuration or
                # returned by codebuild:BatchGetProjects / BatchGetBuilds /
                # the console. In this template it is still passed as a
                # NoEcho CloudFormation parameter because the value has to
                # be literally embedded in this trust policy. Rotate it by
                # updating the Secrets Manager secret in the pipeline
                # account FIRST (new builds pick it up on the next run),
                # then updating this StackSet parameter with the same new
                # value; doing it in the opposite order locks the pipeline
                # out of every member account.
                'sts:ExternalId': !Ref ExternalId
      Policies:
        - PolicyName: customer-managed-policy-management
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read + create actions. CreatePolicy cannot be gated by a tag
              # condition because the policy (and therefore its tag) does not
              # exist yet at create time; the deploy script applies cx-mng:true
              # immediately afterwards via TagPolicy.
              - Sid: IAMPolicyReadAndCreate
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:GetRole
                  - iam:ListPolicies
                  - iam:ListPolicyVersions
                  - iam:ListPolicyTags
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:policy/*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/deploy-customer-managed-policy'
              # Destructive / mutating actions are restricted to policies that
              # already carry the cx-mng:true tag. This makes IAM (not just the
              # deploy script) the enforcement point: even a buggy or tampered
              # script cannot delete/modify policies the pipeline does not own.
              - Sid: IAMPolicyModifyOnlyTagged
                Effect: Allow
                Action:
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicy
                  - iam:DeletePolicyVersion
                  - iam:TagPolicy
                  - iam:UntagPolicy
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/*'
                Condition:
                  StringEquals:
                    'aws:ResourceTag/cx-mng': 'true'
      Tags:
        - Key: cx-mng
          Value: 'true'
        - Key: ManagedBy
          Value: sso-pipeline
